
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 25 - Shopping List Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #2457a7;
            text-align: center;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 15px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 4px;
        }

        li {
            padding: 10px;
            background: #eef3fa;
            margin: 8px 0;
            border-radius: 5px;
        }

        #message {
            margin-top: 15px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Shopping List Manager</h1>

    <input type="text" id="itemName"
           placeholder="Enter item name">

    <input type="number" id="itemQuantity"
           placeholder="Enter quantity">

    <button onclick="addItem()">Add Item</button>
    <button onclick="showList()">Show List</button>
    <button onclick="clearList()">Clear List</button>

    <h2>Your Shopping List</h2>
    <ul id="shoppingList"></ul>

    <p id="message">Your list is empty.</p>
</div>

<script>
let shoppingItems = [];

function addItem() {
    let name = document.getElementById("itemName").value.trim();
    let quantityText = document.getElementById("itemQuantity").value;
    let quantity = Number(quantityText);

    if (name === "" || quantityText === "" ||
        !Number.isInteger(quantity) || quantity <= 0) {
        document.getElementById("message").textContent =
            "Enter a valid item name and positive whole-number quantity.";
        return;
    }

    shoppingItems.push({
        name: name,
        quantity: quantity
    });

    document.getElementById("itemName").value = "";
    document.getElementById("itemQuantity").value = "";

    displayItems();

    console.log("Item added:", name, quantity);
}

function displayItems() {
    let list = document.getElementById("shoppingList");
    list.textContent = "";

    shoppingItems.forEach(function(item) {
        let li = document.createElement("li");
        li.textContent = item.name + " - Quantity: " + item.quantity;
        list.appendChild(li);
    });

    document.getElementById("message").textContent =
        "Total different items: " + shoppingItems.length;
}

function showList() {
    console.log("Shopping List:", shoppingItems);

    if (shoppingItems.length === 0) {
        document.getElementById("message").textContent =
            "Your shopping list is empty.";
        return;
    }

    displayItems();
}

function clearList() {
    shoppingItems = [];
    displayItems();

    document.getElementById("message").textContent =
        "Shopping list cleared.";

    console.log("Shopping list cleared.");
}
</script>

</body>
</html>
