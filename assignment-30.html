
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        .specifications {
            background: #eaf2ff;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Product Details</h1>
        <div id="product"></div>
    </div>

    <script>
        const product = {
            name: "Smartphone",
            brand: "Samsung",
            price: 25000,
            specifications: {
                color: "Black",
                storage: "128 GB",
                ram: "8 GB",
                battery: "5000 mAh",
                display: "6.5 inches"
            }
        };

        document.getElementById("product").innerHTML = `
            <p><strong>Name:</strong> ${product.name}</p>
            <p><strong>Brand:</strong> ${product.brand}</p>
            <p><strong>Price:</strong> ₹${product.price}</p>

            <div class="specifications">
                <h3>Specifications</h3>
                <p>Color: ${product.specifications.color}</p>
                <p>Storage: ${product.specifications.storage}</p>
                <p>RAM: ${product.specifications.ram}</p>
                <p>Battery: ${product.specifications.battery}</p>
                <p>Display: ${product.specifications.display}</p>
            </div>
        `;
    </script>

</body>
</html>
