
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        p {
            color: #475569;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
        }

        .result h2 {
            color: #1d4ed8;
        }

        #error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Grade Calculator</h1>

        <p>Enter your marks out of 100 to calculate your grade.</p>

        <label for="studentName">Student Name</label>
        <input type="text" id="studentName"
               placeholder="Enter your name">

        <label for="marks">Marks (0–100)</label>
        <input type="number" id="marks"
               placeholder="Enter your marks" min="0" max="100">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <p id="error"></p>

        <div class="result" id="result" aria-live="polite">
            Your result will appear here.
        </div>
    </div>

    <script>
        function calculateGrade() {
            const name = document.getElementById("studentName")
                .value.trim();

            const marksInput = document.getElementById("marks").value;
            const marks = Number(marksInput);

            const error = document.getElementById("error");
            const result = document.getElementById("result");

            error.textContent = "";
            result.textContent = "";

            if (name === "" || marksInput === "") {
                error.textContent = "Please enter your name and marks.";
                return;
            }

            if (!Number.isFinite(marks) || marks < 0 || marks > 100) {
                error.textContent = "Marks must be between 0 and 100.";
                return;
            }

            let grade;
            let status;

            // Grade calculation using conditional statements
            if (marks >= 90) {
                grade = "A+";
            } else if (marks >= 80) {
                grade = "A";
            } else if (marks >= 70) {
                grade = "B";
            } else if (marks >= 60) {
                grade = "C";
            } else if (marks >= 50) {
                grade = "D";
            } else if (marks >= 33) {
                grade = "E";
            } else {
                grade = "F";
            }

            if (marks >= 33) {
                status = "Pass";
            } else {
                status = "Fail";
            }

            const heading = document.createElement("h2");
            heading.textContent = "Student Result";

            const nameLine = document.createElement("p");
            nameLine.textContent = "Name: " + name;

            const marksLine = document.createElement("p");
            marksLine.textContent = "Marks: " + marks + "/100";

            const gradeLine = document.createElement("p");
            gradeLine.textContent = "Grade: " + grade;

            const statusLine = document.createElement("p");
            statusLine.textContent = "Status: " + status;

            result.append(
                heading, nameLine, marksLine, gradeLine, statusLine
            );
        }
    </script>

</body>
</html>
